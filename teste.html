<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#050912" />
<title>Desvia! — runner 3D</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:#050912;color:#e8f0ff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  canvas{display:block;touch-action:none}
  #flash{position:fixed;inset:0;pointer-events:none;background:#fff;opacity:0;z-index:5;
    transition:opacity .15s}

  #cam{position:fixed;left:-9999px;top:-9999px;width:320px;height:240px;pointer-events:none}

  #hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;
    justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 16px)
            calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 16px)}
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .stat{font-size:11px;opacity:.6;letter-spacing:.1em;text-transform:uppercase}
  .value{font-size:26px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
  .bar{height:4px;width:44vw;max-width:200px;border-radius:2px;margin-top:8px;
    background:rgba(255,255,255,.12);overflow:hidden}
  .fill{height:100%;width:0%;background:linear-gradient(90deg,#38e8b0,#ffd166,#ff4d6d);
    transition:width .12s linear}
  #ctrlBadge{font-size:10px;opacity:.5;margin-top:6px;letter-spacing:.08em;
    text-transform:uppercase}

  #overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:26px;text-align:center;
    background:rgba(4,8,16,.9);backdrop-filter:blur(10px);transition:opacity .25s;
    overflow-y:auto}
  #overlay.hidden{opacity:0;pointer-events:none}
  #overlay h1{font-size:clamp(30px,10vw,48px);letter-spacing:-.02em;
    background:linear-gradient(180deg,#5cffc8,#22c99a);-webkit-background-clip:text;
    background-clip:text;color:transparent}
  #overlay p{max-width:38ch;font-size:14px;line-height:1.55;opacity:.78}
  #score{font-size:54px;font-weight:800;color:#5cffc8;line-height:1;
    font-variant-numeric:tabular-nums}

  #controlChoice{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    width:100%;max-width:420px;margin:6px 0}
  .ctrl-btn{pointer-events:auto;cursor:pointer;flex:1 1 100px;min-width:110px;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:16px 10px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.08);
    color:#e8f0ff;font-family:inherit;transition:all .15s;
    -webkit-user-select:none;user-select:none}
  .ctrl-btn .icon{font-size:26px;line-height:1}
  .ctrl-btn .label{font-size:14px;font-weight:700}
  .ctrl-btn .hint{font-size:10px;opacity:.55}
  .ctrl-btn:active{transform:scale(.97)}
  .ctrl-btn.active{border-color:#38e8b0;background:rgba(56,232,176,.12)}
  .ctrl-btn.loading{border-color:#ffd166;background:rgba(255,209,102,.1)}
  .ctrl-btn.loading .icon{animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  #status{font-size:12px;opacity:.7;min-height:16px;max-width:36ch;line-height:1.5}
  .btn{pointer-events:auto;cursor:pointer;border:0;border-radius:999px;
    padding:16px 46px;font-size:17px;font-weight:700;color:#06231a;
    background:linear-gradient(180deg,#5cffc8,#22c99a);
    box-shadow:0 8px 24px rgba(34,201,154,.35);transition:transform .1s}
  .btn:active{transform:scale(.95)}
  .btn.ghost{background:transparent;color:#9fb3d9;box-shadow:none;
    padding:10px 22px;font-size:12px;font-weight:600;
    border:1px solid rgba(159,179,217,.28)}
  #warn{font-size:11px;opacity:.45;max-width:34ch;line-height:1.5}
</style>
</head>
<body>

<div id="flash"></div>
<video id="cam" playsinline muted autoplay></video>

<div id="hud">
  <div class="hud-top">
    <div>
      <div class="stat">Distância</div>
      <div class="value" id="dist">0 m</div>
    </div>
    <div style="text-align:right">
      <div class="stat">Velocidade</div>
      <div class="value" id="spd">0 km/h</div>
      <div class="bar"><div class="fill" id="speedFill"></div></div>
    </div>
  </div>
  <div style="pointer-events:auto;display:flex;justify-content:center;align-items:center;gap:10px">
    <div id="ctrlBadge"></div>
    <button class="btn ghost" id="calib">Calibrar</button>
  </div>
</div>

<div id="overlay">
  <h1 id="title">DESVIA!</h1>
  <p id="desc">Escolha como controlar:</p>
  <div id="controlChoice">
    <button class="ctrl-btn" data-ctrl="head">
      <span class="icon">👤</span>
      <span class="label">Cabeça</span>
      <span class="hint">Incline a cabeça</span>
    </button>
    <button class="ctrl-btn" data-ctrl="gyro">
      <span class="icon">📱</span>
      <span class="label">Giroscópio</span>
      <span class="hint">Incline o celular</span>
    </button>
    <button class="ctrl-btn" data-ctrl="touch">
      <span class="icon">👆</span>
      <span class="label">Toque</span>
      <span class="hint">Toque nas laterais</span>
    </button>
  </div>
  <div id="score"></div>
  <div id="status"></div>
  <button class="btn" id="startBtn" style="display:none">Começar</button>
  <div id="warn"></div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* ================= CONFIG ================= */
const CFG = {
  roadWidth: 7.0, maxLateral: 2.8, playerZ: 2,
  spawnZ: -110, despawnZ: 16,
  baseSpeed: 14, maxSpeed: 50, accelPerSec: 1.0,
  tiltRange: 22, invertTilt: false,
  gapStart: 1.2, gapEnd: 0.65,
  collideHalf: 1.3,
  // head control
  yawRange: 0.35,       // rad para lateral total
  headInvert: false,
  headSmooth: 0.35,
};
const LANES = [-2.4, 0, 2.4];
const DASH_GAP = 6.5, DASH_COUNT = 28, DASH_SPAN = DASH_GAP * DASH_COUNT;

/* ================= DOM ================= */
const $ = id => document.getElementById(id);
const el = {
  overlay: $('overlay'), title: $('title'), desc: $('desc'), score: $('score'),
  startBtn: $('startBtn'), status: $('status'), warn: $('warn'),
  dist: $('dist'), spd: $('spd'), speedFill: $('speedFill'),
  calib: $('calib'), cam: $('cam'), flash: $('flash'), ctrlBadge: $('ctrlBadge'),
  ctrlBtns: document.querySelectorAll('.ctrl-btn'),
};

/* ================= ESTADO ================= */
const S = {
  mode: 'menu',               // menu | preparing | ready | playing | over
  control: null,              // 'head' | 'gyro' | 'touch'
  speed: CFG.baseSpeed, distance: 0,
  spawnTimer: 0.9, lastOpenLane: 0,
  targetX: 0, keyX: 0, touchX: null,
  // gyro
  hasGyro: false, tiltZero: null, tiltRaw: 0, tiltSmooth: 0,
  // head
  faceLandmarker: null, faceOn: false,
  headZero: null, headYawSmooth: 0, lastDetect: 0,
};

/* ================= THREE ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050912);
scene.fog = new THREE.Fog(0x050912, 38, 118);

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400);
camera.position.set(0, 4.8, 10);
camera.lookAt(0, 1, -10);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

let baseFov = 60;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  const H_FOV = THREE.MathUtils.degToRad(72);
  camera.fov = THREE.MathUtils.clamp(
    THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(H_FOV / 2) / camera.aspect)), 45, 100
  );
  camera.updateProjectionMatrix();
  baseFov = camera.fov;
}
addEventListener('resize', resize);
resize();

/* ================= LUZES ================= */
scene.add(new THREE.HemisphereLight(0x9dc2ff, 0x0a1020, 0.9));
const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
keyLight.position.set(8, 18, 6);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
Object.assign(keyLight.shadow.camera, {
  left: -12, right: 12, top: 12, bottom: -12, near: 1, far: 40,
});
keyLight.shadow.bias = -0.0005;
scene.add(keyLight);
const rim = new THREE.DirectionalLight(0x38e8b0, 1.2);
rim.position.set(-8, 5, -12);
scene.add(rim);

/* ================= PISTA ================= */
const road = new THREE.Mesh(
  new THREE.BoxGeometry(CFG.roadWidth, 0.6, 320),
  new THREE.MeshStandardMaterial({ color: 0x121a2a, roughness: 0.92, metalness: 0.05 })
);
road.position.set(0, -0.3, -140);
road.receiveShadow = true;
scene.add(road);

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(500, 500),
  new THREE.MeshStandardMaterial({ color: 0x03060c })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.62;
ground.receiveShadow = true;
scene.add(ground);

const railMat = new THREE.MeshStandardMaterial({
  color: 0x2de1c2, emissive: 0x2de1c2, emissiveIntensity: 1.4,
});
for (const x of [-CFG.roadWidth / 2 - 0.15, CFG.roadWidth / 2 + 0.15]) {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 320), railMat);
  rail.position.set(x, 0.06, -140);
  scene.add(rail);
}

const dashGeo = new THREE.BoxGeometry(0.14, 0.02, 2.4);
const dashMat = new THREE.MeshStandardMaterial({
  color: 0x4a6a9a, emissive: 0x1c4a80, emissiveIntensity: 0.9,
});
const dashes = [];
for (const x of [-1.2, 1.2]) {
  for (let i = 0; i < DASH_COUNT; i++) {
    const d = new THREE.Mesh(dashGeo, dashMat);
    d.position.set(x, 0.02, 12 - i * DASH_GAP);
    scene.add(d);
    dashes.push(d);
  }
}

// estrelas
{
  const N = 400, pos = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const r = 90 + Math.random() * 220;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = Math.abs(r * Math.cos(ph)) + 20;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({
    color: 0x88aaff, size: 0.6, transparent: true, opacity: 0.75,
  })));
}

// riscos de velocidade
const streaks = [];
{
  const geo = new THREE.BoxGeometry(0.05, 0.05, 3.2);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x5cffc8, emissive: 0x2de1c2, emissiveIntensity: 2,
    transparent: true, opacity: 0.55,
  });
  for (let i = 0; i < 18; i++) {
    const s = new THREE.Mesh(geo, mat);
    s.position.set((Math.random() < 0.5 ? -1 : 1) * (CFG.roadWidth / 2 + 0.6 + Math.random()),
                   0.3 + Math.random() * 0.6, 12 - Math.random() * 130);
    scene.add(s);
    streaks.push(s);
  }
}

/* ================= JOGADOR ================= */
const player = new THREE.Group();
{
  const bodyMat = new THREE.MeshStandardMaterial({
    color: 0x38e8b0, emissive: 0x0f8f6b, emissiveIntensity: 0.4,
    roughness: 0.3, metalness: 0.65,
  });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x0a1420, roughness: 0.15, metalness: 0.9 });
  const chassis = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.32, 1.5), bodyMat);
  chassis.position.y = 0.3; chassis.castShadow = true; player.add(chassis);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.7), darkMat);
  cabin.position.set(0, 0.6, -0.1); cabin.castShadow = true; player.add(cabin);
  const spoiler = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.08, 0.2), darkMat);
  spoiler.position.set(0, 0.66, 0.66); player.add(spoiler);
  const hlMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 2.5 });
  for (const sx of [-0.28, 0.28]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.08, 0.05), hlMat);
    hl.position.set(sx, 0.32, -0.76); player.add(hl);
  }
  const tlMat = new THREE.MeshStandardMaterial({ color: 0xff2a4d, emissive: 0xff2a4d, emissiveIntensity: 2.5 });
  for (const sx of [-0.3, 0.3]) {
    const tl = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.06, 0.04), tlMat);
    tl.position.set(sx, 0.32, 0.76); player.add(tl);
  }
  const wGeo = new THREE.CylinderGeometry(0.16, 0.16, 0.14, 10);
  const wMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.85 });
  for (const [sx, sz] of [[-0.48,-0.5],[0.48,-0.5],[-0.48,0.5],[0.48,0.5]]) {
    const w = new THREE.Mesh(wGeo, wMat);
    w.rotation.z = Math.PI / 2; w.position.set(sx, 0.16, sz);
    w.castShadow = true; player.add(w);
  }
  player.position.set(0, 0, CFG.playerZ);
  scene.add(player);
}

/* ================= OBSTÁCULOS ================= */
const POOL = 30;
const obstacles = [];
const obstGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
const obstEdgeGeo = new THREE.EdgesGeometry(obstGeo);
for (let i = 0; i < POOL; i++) {
  const g = new THREE.Group();
  const core = new THREE.Mesh(obstGeo, new THREE.MeshStandardMaterial({
    color: 0xff4d6d, emissive: 0x7a0f22, emissiveIntensity: 0.8,
    roughness: 0.45, metalness: 0.3,
  }));
  core.position.y = 0.8;
  core.castShadow = true; core.receiveShadow = true;
  g.add(core);
  const edges = new THREE.LineSegments(obstEdgeGeo,
    new THREE.LineBasicMaterial({ color: 0xff9fb3, transparent: true, opacity: 0.9 }));
  edges.position.y = 0.8;
  g.add(edges);
  g.visible = false;
  g.userData.active = false;
  scene.add(g);
  obstacles.push(g);
}

/* ================= INPUT: GIROSCÓPIO ================= */
function onOrientation(e) {
  if (e.gamma === null || e.gamma === undefined) return;
  S.hasGyro = true;
  const a = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  let v;
  if (a === 0) v = e.gamma;
  else if (a === 90) v = e.beta;
  else if (a === 270 || a === -90) v = -e.beta;
  else v = -e.gamma;
  if (S.tiltZero === null) S.tiltZero = v;
  S.tiltRaw = (CFG.invertTilt ? -1 : 1) * (v - S.tiltZero);
  S.tiltSmooth += (S.tiltRaw - S.tiltSmooth) * 0.35;
}

/* ================= INPUT: TOQUE / TECLADO ================= */
function pointerX(cx) {
  const t = (cx / innerWidth - 0.5) * 2;
  return THREE.MathUtils.clamp(t * (CFG.maxLateral + 0.4), -CFG.maxLateral, CFG.maxLateral);
}
renderer.domElement.addEventListener('pointerdown', e => {
  if (S.mode === 'playing' && S.control === 'touch') S.touchX = pointerX(e.clientX);
});
renderer.domElement.addEventListener('pointermove', e => {
  if (S.mode === 'playing' && S.control === 'touch' && S.touchX !== null)
    S.touchX = pointerX(e.clientX);
});
addEventListener('pointerup', () => { S.touchX = null; });
addEventListener('pointercancel', () => { S.touchX = null; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') S.keyX = -1;
  if (e.key === 'ArrowRight' || e.key === 'd') S.keyX = 1;
});
addEventListener('keyup', e => {
  if (['ArrowLeft','a','ArrowRight','d'].includes(e.key)) S.keyX = 0;
});

/* ================= INPUT: CABEÇA ================= */
async function initHead() {
  const { FaceLandmarker, FilesetResolver } = await import(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10'
  );
  const resolver = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.10/wasm'
  );
  S.faceLandmarker = await FaceLandmarker.createFromOptions(resolver, {
    baseOptions: {
      modelAssetPath:
        'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU',
    },
    outputFacialTransformationMatrixes: true,
    runningMode: 'VIDEO',
    numFaces: 1,
  });
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } },
    audio: false,
  });
  el.cam.srcObject = stream;
  await el.cam.play();
  S.faceOn = true;
  requestAnimationFrame(faceLoop);
}

function faceLoop(now) {
  requestAnimationFrame(faceLoop);
  if (!S.faceOn || !S.faceLandmarker) return;
  if (now - S.lastDetect < 60) return; // ~16 fps
  if (el.cam.readyState < 2) return;
  S.lastDetect = now;

  let res;
  try { res = S.faceLandmarker.detectForVideo(el.cam, now); }
  catch (_) { return; }

  const mat = res.facialTransformationMatrixes?.[0]?.data;
  if (!mat || mat.length < 16) {
    // sem rosto: decai a inclinação suavemente para o centro
    S.headYawSmooth *= 0.94;
    return;
  }

  // yaw ≈ rotação em torno do eixo vertical da cabeça
  const yaw = Math.atan2(mat[8], mat[10]);
  if (S.headZero === null) S.headZero = yaw;

  const delta = (CFG.headInvert ? -1 : 1) * (yaw - S.headZero);
  S.headYawSmooth += (delta - S.headYawSmooth) * CFG.headSmooth;
}

/* ================= REGRAS ================= */
function reset() {
  S.speed = CFG.baseSpeed;
  S.distance = 0;
  S.spawnTimer = 0.9;
  S.lastOpenLane = 0;
  S.targetX = 0; S.touchX = null; S.keyX = 0;
  S.tiltZero = null; S.tiltSmooth = 0;
  S.headZero = null; S.headYawSmooth = 0;
  player.position.set(0, 0, CFG.playerZ);
  player.rotation.z = 0;
  camera.position.x = 0;
  camera.fov = baseFov; camera.updateProjectionMatrix();
  for (const o of obstacles) { o.userData.active = false; o.visible = false; }
}

function spawnRow() {
  let openLane = S.lastOpenLane;
  if (Math.random() < 0.7) {
    do { openLane = Math.floor(Math.random() * 3); }
    while (openLane === S.lastOpenLane);
  }
  S.lastOpenLane = openLane;

  const warmup = S.distance < 40;
  const nBlock = warmup ? 1 : 2;
  const candidates = [0, 1, 2].filter(i => i !== openLane);
  for (let i = candidates.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
  }
  for (let k = 0; k < nBlock && k < candidates.length; k++) {
    const o = obstacles.find(o => !o.userData.active);
    if (!o) break;
    o.position.set(LANES[candidates[k]], 0, CFG.spawnZ);
    o.visible = true;
    o.userData.active = true;
  }

  const t = (S.speed - CFG.baseSpeed) / (CFG.maxSpeed - CFG.baseSpeed);
  S.spawnTimer = THREE.MathUtils.lerp(CFG.gapStart, CFG.gapEnd, t);
}

function gameOver() {
  S.mode = 'over';
  if (navigator.vibrate) navigator.vibrate(120);
  flashScreen('#ff2a4d', 0.55);
  camera.position.x += 0.4 * (Math.random() - 0.5);
  el.title.textContent = 'Bateu!';
  el.desc.textContent = 'A esteira não perdoa. Tenta de novo?';
  el.score.textContent = Math.floor(S.distance) + ' m';
  el.startBtn.style.display = '';
  el.startBtn.textContent = 'Jogar de novo';
  el.overlay.classList.remove('hidden');
}

function flashScreen(color, alpha) {
  el.flash.style.background = color;
  el.flash.style.opacity = alpha;
  setTimeout(() => { el.flash.style.opacity = 0; }, 90);
}

/* ================= UPDATE ================= */
function readInput() {
  if (S.control === 'touch') {
    if (S.touchX !== null) S.targetX = S.touchX;
    else if (S.keyX !== 0) S.targetX = S.keyX * CFG.maxLateral;
    // sem toque: mantém alvo
  } else if (S.control === 'gyro') {
    S.targetX = THREE.MathUtils.clamp(S.tiltSmooth / CFG.tiltRange, -1, 1) * CFG.maxLateral;
  } else if (S.control === 'head') {
    const n = THREE.MathUtils.clamp(S.headYawSmooth / CFG.yawRange, -1, 1);
    S.targetX = n * CFG.maxLateral;
  }
}

function updatePlaying(dt) {
  S.speed = Math.min(CFG.maxSpeed, S.speed + CFG.accelPerSec * dt);
  S.distance += S.speed * dt;

  readInput();
  player.position.x += (S.targetX - player.position.x) * Math.min(1, dt * 14);
  player.position.x = THREE.MathUtils.clamp(player.position.x, -CFG.maxLateral, CFG.maxLateral);
  player.rotation.z = THREE.MathUtils.clamp((S.targetX - player.position.x) * 0.35, -0.4, 0.4);

  const move = S.speed * dt;
  for (const d of dashes) {
    d.position.z += move;
    if (d.position.z > 12) d.position.z -= DASH_SPAN;
  }
  for (const s of streaks) {
    s.position.z += move * 1.6;
    if (s.position.z > 12) {
      s.position.z -= 140;
      s.position.x = (Math.random() < 0.5 ? -1 : 1) * (CFG.roadWidth / 2 + 0.6 + Math.random());
    }
    s.material.opacity = 0.25 + 0.3 * Math.random();
  }

  const pzMin = CFG.playerZ - 1.3, pzMax = CFG.playerZ + 1.3;
  const px = player.position.x;
  for (const o of obstacles) {
    if (!o.userData.active) continue;
    const z0 = o.position.z, z1 = z0 + move;
    o.position.z = z1;
    if (z1 > CFG.despawnZ) { o.userData.active = false; o.visible = false; continue; }
    if (z0 <= pzMax && z1 >= pzMin && Math.abs(o.position.x - px) < CFG.collideHalf) {
      gameOver(); return;
    }
  }

  S.spawnTimer -= dt;
  if (S.spawnTimer <= 0) spawnRow();

  el.dist.textContent = Math.floor(S.distance) + ' m';
  el.spd.textContent  = Math.round(S.speed * 3.6) + ' km/h';
  el.speedFill.style.width =
    ((S.speed - CFG.baseSpeed) / (CFG.maxSpeed - CFG.baseSpeed) * 100) + '%';
}

function updateCamera(dt) {
  const px = player.position.x;
  camera.position.x += (px * 0.45 - camera.position.x) * Math.min(1, dt * 5);
  camera.lookAt(px * 0.22, 1.0, -10);
}

/* ================= LOOP ================= */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (S.mode === 'playing') updatePlaying(dt);
  updateCamera(dt);
  renderer.render(scene, camera);
}
requestAnimationFrame(loop);

/* ================= SELEÇÃO DE CONTROLE ================= */
function setCtrlUI(state, msg) {
  el.ctrlBtns.forEach(b => {
    const mine = b.dataset.ctrl === S.control;
    b.classList.toggle('active', mine && state !== 'error');
    b.classList.toggle('loading', mine && state === 'preparing');
  });
  el.status.textContent = msg || '';
  if (state === 'ready') {
    el.startBtn.style.display = '';
    el.startBtn.textContent = 'Começar';
    el.desc.textContent = 'Pronto! Clique em Começar.';
  } else if (state === 'preparing') {
    el.startBtn.style.display = 'none';
    el.desc.textContent = 'Preparando…';
  } else if (state === 'error') {
    el.startBtn.style.display = 'none';
    el.desc.textContent = 'Escolha outro método:';
  }
}

const CTRL_LABEL = { head: '👤 Cabeça', gyro: '📱 Giroscópio', touch: '👆 Toque' };

async function selectControl(ctrl) {
  if (S.mode === 'playing') return;
  S.control = ctrl;
  S.mode = 'preparing';
  el.warn.textContent = '';
  setCtrlUI('preparing', ctrl === 'head' ? 'Aguardando câmera…'
                                 : ctrl === 'gyro' ? 'Aguardando sensor…'
                                 : '');

  try {
    if (ctrl === 'head') {
      await initHead();
    } else if (ctrl === 'gyro') {
      if (typeof DeviceOrientationEvent !== 'undefined' &&
          typeof DeviceOrientationEvent.requestPermission === 'function') {
        const r = await DeviceOrientationEvent.requestPermission();
        if (r !== 'granted') throw new Error('Permissão de giroscópio negada.');
      }
      window.addEventListener('deviceorientation', onOrientation);
      // espera até 2s por uma leitura real
      await new Promise((res, rej) => {
        const t0 = performance.now();
        const check = () => {
          if (S.hasGyro) return res();
          if (performance.now() - t0 > 2000) return rej(new Error('Sem leitura do giroscópio.'));
          requestAnimationFrame(check);
        };
        check();
      });
    } else {
      // touch: sempre disponível
    }
    S.mode = 'ready';
    setCtrlUI('ready');
  } catch (err) {
    S.mode = 'menu';
    setCtrlUI('error', err.message || 'Falha ao iniciar controle.');
  }
}

el.ctrlBtns.forEach(b => {
  b.addEventListener('click', () => selectControl(b.dataset.ctrl));
});

/* ================= INÍCIO DO JOGO ================= */
async function start() {
  if (!S.control) return;

  // recalibra zeragem conforme o método
  if (S.control === 'head') S.headZero = null;
  if (S.control === 'gyro') S.tiltZero = null;

  // tela cheia (silencioso se falhar)
  try {
    if (document.fullscreenEnabled && !document.fullscreenElement) {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    }
  } catch (_) {}

  reset();
  S.mode = 'playing';
  el.overlay.classList.add('hidden');
  el.warn.textContent = '';
  el.ctrlBadge.textContent = CTRL_LABEL[S.control] || '';
  last = performance.now();
}

el.startBtn.addEventListener('click', start);
el.calib.addEventListener('click', () => {
  if (S.control === 'gyro') S.tiltZero = null;
  if (S.control === 'head') S.headZero = null;
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });

if (!('ontouchstart' in window)) {
  el.warn.textContent = 'No PC: setas ← → funcionam no modo Toque.';
}
</script>
